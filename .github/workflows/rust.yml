name: Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: "linux", arch: "x86_64", runner: "ubuntu-latest"}
          - {os: "linux", arch: "aarch64", runner: "ubuntu-24.04-arm"}
          - {os: "macos", arch: "x86_64", runner: "macos-26-intel"}
          - {os: "macos", arch: "aarch64", runner: "macos-latest"}
          - {os: "windows", arch: "x86_64", runner: "windows-latest"}
          - {os: "windows", arch: "aarch64", runner: "windows-11-arm" }

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Zig
        if: matrix.target.os == 'linux'
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.target.os == 'linux'
        run: pipx install cargo-zigbuild

      - name: Build library
        shell: bash
        run: |
          if [ "${{ matrix.target.os }}" == "linux" ]; then
            mkdir -p target/release/
            if [ "${{ matrix.target.arch }}" == "x86_64" ]; then
              rustup target add x86_64-unknown-linux-gnu
              cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31
              cp target/x86_64-unknown-linux-gnu/release/libclassloader.so target/release/
            else
              rustup target add aarch64-unknown-linux-gnu
              cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31
              cp target/aarch64-unknown-linux-gnu/release/libclassloader.so target/release/
            fi
          else
            cargo build --release
          fi

      - name: Run tests
        run: cargo test --release

      - name: Rename artifacts
        shell: bash
        run: |
          cd target/release/
          suffix="${{ matrix.target.os }}-${{ matrix.target.arch }}"
          case "${{ matrix.target.os }}" in
            windows)
              mv classloader.dll classloader-$suffix.dll
              ;;
            macos)
              mv libclassloader.dylib libclassloader-$suffix.dylib
              ;;
            linux)
              mv libclassloader.so libclassloader-$suffix.so
              ;;
          esac

      - name: Upload dynamic libraries
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: shared-libs-${{ matrix.target.os }}-${{ matrix.target.arch}}
          path: |
            target/release/*.dll
            target/release/*.so
            target/release/*.dylib
          if-no-files-found: ignore
